<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>수집 결과</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.6 "맑은 고딕", system-ui, sans-serif; margin: 0; padding: 24px 28px; max-width: 1100px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #666; margin-bottom: 18px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 18px; }
  button { padding: 9px 16px; font-size: 14px; cursor: pointer; border-radius: 5px; border: 1px solid #bbb; background: #f6f6f6; }
  button.primary { background: #1f3864; color: #fff; border-color: #1f3864; font-weight: 600; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
  th, td { border: 1px solid #ccc; padding: 7px 9px; text-align: left; vertical-align: top; font-size: 13px; }
  th { background: #1f3864; color: #fff; font-weight: 600; }
  tr.ok td:nth-child(2) { background: #e2efda; font-weight: 600; }
  tr.bad td:nth-child(2) { background: #fbe4d5; font-weight: 600; }
  tr.warn td:nth-child(2) { background: #fff2cc; font-weight: 600; }
  h2 { font-size: 16px; margin: 26px 0 8px; }
  td.num { text-align: right; }
  .log { color: #555; font-size: 12px; white-space: pre-wrap; }
  textarea { width: 100%; height: 260px; font: 12px/1.45 ui-monospace, Consolas, monospace; padding: 8px; box-sizing: border-box; }
  .note { background: #f2f2f2; padding: 12px 14px; border-radius: 5px; margin-bottom: 18px; }
  .empty { padding: 40px; text-align: center; color: #888; }
</style>
</head>
<body>
  <h1>수집 결과</h1>
  <div class="sub" id="summary">불러오는 중…</div>

  <div class="note">
    아래 <b>수집기록.json</b>을 Claude 에게 보내주세요.
    파일로 저장하거나, 전체를 복사해서 채팅에 붙여넣어도 됩니다.
  </div>

  <h2 style="margin-top:0">① 주소 찾기 결과</h2>
  <div class="sub" id="foundSummary"></div>
  <div class="bar">
    <button id="saveFound" class="primary">검색결과.json 저장</button>
  </div>
  <div id="foundWrap"></div>

  <h2>② 이미지 수집 결과</h2>
  <div class="bar">
    <button id="save" class="primary">수집기록.json 저장</button>
    <button id="copy">전체 복사</button>
    <button id="reload">새로고침</button>
  </div>

  <div id="tableWrap"></div>

  <h2 style="font-size:16px">원본 (수집기록.json)</h2>
  <textarea id="json" readonly></textarea>

  <script src="results.js"></script>
</body>
</html>
